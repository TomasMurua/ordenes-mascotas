services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: dsy2201-oracle-ordenes
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: ordenes_app
      APP_USER_PASSWORD: ordenes123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  ordenes-mascotas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsy2201-ordenes
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ordenes_app
      SPRING_DATASOURCE_PASSWORD: ordenes123
    depends_on:
      oracle:
        condition: service_healthy
    restart: on-failure

volumes:
  oracle-data:
